
name: Build FlyReset 2.0

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          FILE=$(find . -maxdepth 6 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: build.gradle nu a fost gasit!"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project in $DIR"

      - name: Build FlyReset
        shell: bash
        run: gradle -p "${{ steps.project.outputs.dir }}" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FlyReset-2.0-Fabric-26.3
          path: '**/build/libs/flyreset-2.0.0.jar'
          if-no-files-found: error
